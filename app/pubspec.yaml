name: app
description: "College Marks Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # Firebase Core
  firebase_core: ^3.3.0
  
  # Firebase Services
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.1.0
  
  # State Management
  provider: ^6.1.2
  
  # PDF Generation & Printing
  pdf: ^3.11.0
  printing: ^5.12.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  
  # Date/Time Formatting (for attendance screens)
  intl: ^0.19.0
  
  # HTTP Client (for future n8n integration)
  http: ^1.2.2
  
  # Charts (optional - for future analytics)
  fl_chart: ^0.68.0

  # Google Fonts for professional typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
  adaptive_icon_background: "#1A3C7A"
  adaptive_icon_foreground: "assets/logos/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/logos/college_logo.png
    - assets/logos/trust_logo.png
    - assets/logos/aiml_logo.png
    - assets/logos/app_icon.png